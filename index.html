<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackSuperman Jr Elite System</title>

<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding:12px}
.app{max-width:700px;margin:auto}
.card{background:#18181c;border-radius:18px;padding:16px;margin-bottom:12px}
h1{font-size:26px}
h2{margin:6px 0}
button{width:100%;padding:16px;border:0;border-radius:12px;background:#facc15;color:#000;font-weight:900;margin-top:10px}
.small{color:#aaa;font-size:13px}
a{color:#4ade80;display:block;margin:6px 0}
</style>

</head>
<body>

<div class="app">

<h1>Jr Elite Training System</h1>

<div class="card">
<h2 id="dayTitle"></h2>
<p id="focus"></p>
</div>

<div class="card">
<h2>Morning Session (25–30 min)</h2>
<div id="morning"></div>
</div>

<div class="card">
<h2>Evening Session (45–55 min)</h2>
<div id="evening"></div>
</div>

<div class="card">
<h2>Daily Reflection</h2>
<textarea id="notes" placeholder="What felt good? What needs work?" style="width:100%;height:80px;border-radius:10px;padding:10px"></textarea>
<button onclick="saveNote()">Save Reflection</button>
</div>

<button onclick="completeDay()">Complete Day</button>

</div>

<script>

const days = [

{
name:"Monday",
focus:"Acceleration + Lower Body Explosive Strength",

morning:[
["Dynamic Warmup 5 min","https://www.youtube.com/results?search_query=dynamic+warmup+youth+athletes"],
["Sprint Starts 6x10yd","https://www.youtube.com/results?search_query=10+yard+sprint+start+football"],
["Wall Drive Drill 3x15","https://www.youtube.com/results?search_query=wall+drive+drill+sprint"],
["Pogo Jumps 3x20","https://www.youtube.com/results?search_query=pogo+jumps+athlete"],
["Broad Jumps 4x5","https://www.youtube.com/results?search_query=broad+jumps+football"]
],

evening:[
["Split Squats 3x10","https://www.youtube.com/results?search_query=split+squat+proper+form"],
["Step Ups 3x10","https://www.youtube.com/results?search_query=step+ups+athlete"],
["Glute Bridges 3x15","https://www.youtube.com/results?search_query=glute+bridge"],
["Plank 3x45s","https://www.youtube.com/results?search_query=plank+form"],
["Stretch + Mobility 10 min","https://www.youtube.com/results?search_query=athlete+mobility+routine"]
]
},

{
name:"Tuesday",
focus:"Agility + Upper Body Strength",

morning:[
["Ladder Drills 10 min","https://www.youtube.com/results?search_query=agility+ladder+football"],
["5-10-5 Shuttle 5 reps","https://www.youtube.com/results?search_query=5-10-5+shuttle"],
["Cone Zig Zag 5 reps","https://www.youtube.com/results?search_query=zig+zag+cone+drill"],
["Reaction Drill 6 reps","https://www.youtube.com/results?search_query=reaction+drills+football"]
],

evening:[
["Push Ups 4x12","https://www.youtube.com/results?search_query=push+ups+proper+form"],
["Band Rows 3x12","https://www.youtube.com/results?search_query=resistance+band+rows"],
["Shoulder Taps 3x20","https://www.youtube.com/results?search_query=shoulder+taps+core"],
["Core Circuit 10 min","https://www.youtube.com/results?search_query=core+workout+athletes"]
]
},

{
name:"Wednesday",
focus:"Plyometric Power + Recovery",

morning:[
["Warmup","https://www.youtube.com/results?search_query=dynamic+warmup"],
["Single Leg Bounds 4x5 each","https://www.youtube.com/results?search_query=single+leg+bounds"],
["Skater Jumps 3x12","https://www.youtube.com/results?search_query=skater+jumps"],
["Box or Stair Jumps 4x6","https://www.youtube.com/results?search_query=box+jumps"],
["Push Up Starts 5 reps","https://www.youtube.com/results?search_query=push+up+start+drill"]
],

evening:[
["Light Mobility","https://www.youtube.com/results?search_query=mobility+routine"],
["Stretching 15 min","https://www.youtube.com/results?search_query=stretching+athletes"]
]
},

{
name:"Thursday",
focus:"Lateral Movement + Total Body",

morning:[
["Lateral Shuffle 5x","https://www.youtube.com/results?search_query=lateral+shuffle+football"],
["Mirror Drill 6 reps","https://www.youtube.com/results?search_query=mirror+drill+football"],
["LB Reaction Drill","https://www.youtube.com/results?search_query=linebacker+reaction+drill"]
],

evening:[
["Bodyweight Circuit","https://www.youtube.com/results?search_query=bodyweight+workout+athletes"],
["Core + Balance","https://www.youtube.com/results?search_query=balance+training+athletes"]
]
},

{
name:"Friday",
focus:"Conditioning + Competition",

morning:[
["Sprint Intervals","https://www.youtube.com/results?search_query=sprint+intervals"],
["Cone Suicides","https://www.youtube.com/results?search_query=cone+suicides"],
["Shuttle Races","https://www.youtube.com/results?search_query=shuttle+run+football"]
],

evening:[
["Light Recovery","https://www.youtube.com/results?search_query=recovery+workout"],
["Stretch + Hydrate","https://www.youtube.com/results?search_query=stretching"]
]
},

{
name:"Saturday",
focus:"Recovery Day",
morning:[["Walk + Stretch","https://www.youtube.com/results?search_query=light+stretching"]],
evening:[["Rest",""]]
},

{
name:"Sunday",
focus:"Full Rest",
morning:[["Rest",""]],
evening:[["Rest",""]]
}

]

let current = Number(localStorage.getItem("day")||0)

function render(){
let d = days[current]
document.getElementById("dayTitle").innerText = d.name
document.getElementById("focus").innerText = d.focus

let m = d.morning.map(x=>`<p>${x[0]}</p><a href="${x[1]}" target="_blank">Watch</a>`).join("")
let e = d.evening.map(x=>`<p>${x[0]}</p><a href="${x[1]}" target="_blank">Watch</a>`).join("")

document.getElementById("morning").innerHTML = m
document.getElementById("evening").innerHTML = e
}

function completeDay(){
current++
if(current>=days.length) current=0
localStorage.setItem("day",current)
render()
}

function saveNote(){
localStorage.setItem("note_"+current,document.getElementById("notes").value)
alert("Saved")
}

render()

</script>

</body>
</html>
